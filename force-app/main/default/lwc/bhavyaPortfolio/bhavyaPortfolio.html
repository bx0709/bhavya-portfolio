<template>
  <div class="portfolio-root">

    <canvas class="particle-canvas"></canvas>

    <!-- SYNC STATUS BADGE -->
    <div class={syncBadgeClass}>
      <span class="sync-dot"></span>
      <template if:true={lastSynced}>
        Synced from Google Docs · {lastSynced}
      </template>
      <template if:false={lastSynced}>
        Loading from Salesforce…
      </template>
    </div>

    <!-- NAV -->
    <nav class="nav">
      <div class="nav-logo">BG.dev</div>
      <ul class="nav-links">
        <li><a href="#skills"       onclick={handleNavClick}>Skills</a></li>
        <li><a href="#experience"   onclick={handleNavClick}>Experience</a></li>
        <li><a href="#achievements" onclick={handleNavClick}>Awards</a></li>
        <li><a href="#community"    onclick={handleNavClick}>Community</a></li>
        <li><a href="#writing"      onclick={handleNavClick}>Blog</a></li>
        <li><a href="#contact"      onclick={handleNavClick}>Contact</a></li>
      </ul>
      <a class="nav-cta" href={contactEmail}>Hire Me</a>
    </nav>

    <!-- LOADING STATE -->
    <template if:true={isLoading}>
      <div class="loading-screen">
        <div class="loading-spinner"></div>
        <p>Loading portfolio…</p>
      </div>
    </template>

    <!-- ERROR STATE -->
    <template if:true={hasError}>
      <div class="error-banner">
        ⚠ Could not load portfolio data from Salesforce. Showing cached defaults.
      </div>
    </template>

    <!-- HERO -->
    <template if:false={isLoading}>
      <div class="hero">
        <div class="hero-eyebrow">Salesforce Developer · {heroData.certCount}× Certified</div>
        <h1 class="hero-name">
          {heroData.firstName}<span>{heroData.lastName}</span>
        </h1>
        <p class="hero-title">
          {heroData.tagline}<br/>
          {heroData.location} &nbsp;·&nbsp; {heroData.experience}
        </p>
        <div class="hero-stats">
          <template for:each={heroStats} for:item="stat">
            <div key={stat.id} class="stat-item">
              <span class="stat-num">{stat.num}</span>
              <span class="stat-label">{stat.label}</span>
            </div>
          </template>
        </div>
        <div class="hero-ctas">
          <a href={contactEmail} class="btn-primary">Get in Touch</a>
          <a href={heroData.linkedin} target="_blank" class="btn-outline">LinkedIn ↗</a>
          <button class="btn-outline" onclick={handleBlogNav}>Read My Blog ↗</button>
        </div>
        <div class="hero-scroll">
          <div class="scroll-line"></div>
          Scroll to explore
        </div>
      </div>

      <!-- CERT STRIP -->
      <div class="cert-strip">
        <div class="cert-strip-inner">
          <span class="cert-strip-label">Salesforce Certifications</span>
          <div class="cert-badges">
            <template for:each={certifications} for:item="cert">
              <div key={cert.id} class="cert-badge">
                <div class="cert-dot"></div>
                {cert.name}
              </div>
            </template>
          </div>
        </div>
      </div>

      <!-- SKILLS -->
      <section class="section section-alt" id="skills">
        <div class="section-inner">
          <div class="section-label">Technical Expertise</div>
          <h2 class="section-title">Skills &amp; Stack</h2>
          <div class="skills-grid">
            <div class="skill-group">
              <div class="skill-group-title">Salesforce Core</div>
              <template for:each={coreSkills} for:item="skill">
                <div key={skill.id} class="skill-item">
                  <div class="skill-row">
                    <span class="skill-name">{skill.name}</span>
                    <span class="skill-pct">{skill.pct}%</span>
                  </div>
                  <div class="skill-bar">
                    <div class="skill-fill" style={skill.style}></div>
                  </div>
                </div>
              </template>
            </div>
            <div class="skill-group">
              <div class="skill-group-title">Clouds &amp; Integration</div>
              <template for:each={cloudSkills} for:item="skill">
                <div key={skill.id} class="skill-item">
                  <div class="skill-row">
                    <span class="skill-name">{skill.name}</span>
                    <span class="skill-pct">{skill.pct}%</span>
                  </div>
                  <div class="skill-bar">
                    <div class="skill-fill" style={skill.style}></div>
                  </div>
                </div>
              </template>
              <div class="skill-group-title" style="margin-top:1.5rem">DevOps &amp; Languages</div>
              <div class="skill-tags">
                <template for:each={toolTags} for:item="tag">
                  <span key={tag} class="skill-tag">{tag}</span>
                </template>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- EXPERIENCE -->
      <section class="section" id="experience">
        <div class="section-inner">
          <div class="section-label">Work History</div>
          <h2 class="section-title">Experience</h2>
          <div class="timeline">
            <template for:each={experiences} for:item="exp">
              <div key={exp.id} class="timeline-entry">
                <div class={exp.dotClass}></div>
                <div data-animate="true" class="timeline-item">
                  <div class="timeline-header">
                    <div class="timeline-role">{exp.role}</div>
                    <div class="timeline-period">{exp.period}</div>
                  </div>
                  <div class="timeline-company">{exp.company}</div>
                  <ul class="timeline-bullets">
                    <template for:each={exp.bullets} for:item="b">
                      <li key={b.id}>
                        {b.text}
                        <template if:true={b.chip}>
                          <span class="impact-chip">{b.chip}</span>
                        </template>
                      </li>
                    </template>
                  </ul>
                </div>
              </div>
            </template>
          </div>
        </div>
      </section>

      <!-- AWARDS -->
      <section class="section section-alt" id="achievements">
        <div class="section-inner">
          <div class="section-label">Recognition</div>
          <h2 class="section-title">Awards & Impact</h2>
          <div class="achievements-grid">
            <template for:each={awards} for:item="award">
              <div key={award.id} data-animate="true" class="achievement-card">
                <div class="achievement-icon">{award.icon}</div>
                <div class="achievement-title">{award.title}</div>
                <div class="achievement-desc">{award.desc}</div>
              </div>
            </template>
          </div>
        </div>
      </section>

      <!-- COMMUNITY -->
      <section class="section" id="community">
        <div class="section-inner">
          <div class="section-label">Beyond the Code</div>
          <h2 class="section-title">Community & Leadership</h2>
          <div class="community-grid">
            <template for:each={communityItems} for:item="item">
              <div key={item.id} data-animate="true" class="community-card">
                <div class="community-icon">{item.icon}</div>
                <div>
                  <div class="community-title">{item.title}</div>
                  <div class="community-sub">{item.sub}</div>
                </div>
              </div>
            </template>
          </div>
        </div>
      </section>

      <!-- WRITING / BLOG TEASER -->
      <section class="section section-alt" id="writing">
        <div class="section-inner">
          <div class="section-label">Writing</div>
          <h2 class="section-title">From the Blog</h2>
          <template if:true={blogLoading}>
            <lightning-spinner alternative-text="Loading posts" size="medium"></lightning-spinner>
          </template>
          <template if:false={blogLoading}>
            <template if:true={hasBlogPosts}>
              <div class="blog-teaser-grid">
                <template for:each={latestPosts} for:item="post">
                  <article key={post.id} class="blog-teaser-card" data-slug={post.slug} onclick={handleBlogPostClick}>
                    <p class="blog-teaser-date">{post.publishedDate}</p>
                    <h3 class="blog-teaser-title">{post.title}</h3>
                    <p class="blog-teaser-summary">{post.summary}</p>
                    <template if:true={post.tags}>
                      <p class="blog-teaser-tags">{post.tags}</p>
                    </template>
                  </article>
                </template>
              </div>
            </template>
            <template if:false={hasBlogPosts}>
              <p class="blog-teaser-empty">No posts published yet — check back soon.</p>
            </template>
          </template>
          <div class="blog-teaser-footer">
            <button class="btn-outline blog-view-all" onclick={handleBlogNav}>View All Posts →</button>
          </div>
        </div>
      </section>

      <!-- EDUCATION -->
      <section class="section section-alt" id="education">
        <div class="section-inner">
          <div class="section-label">Academic Background</div>
          <h2 class="section-title">Education</h2>
          <div class="edu-card">
            <div>
              <div class="edu-school">{educationData.school}</div>
              <div class="edu-degree">{educationData.degree}</div>
              <div class="edu-year">{educationData.years}</div>
            </div>
            <div class="edu-gpa">
              <span class="gpa-num">{educationData.cgpa}</span>
              <span class="gpa-label">CGPA</span>
            </div>
          </div>
        </div>
      </section>

      <!-- CONTACT -->
      <section class="section section-contact" id="contact">
        <div class="section-inner">
          <div class="contact-wrapper">
            <div class="section-label" style="text-align:center">Let's Connect</div>
            <h2 class="contact-title">Open to New<br/>Opportunities</h2>
            <p class="contact-sub">{heroData.contactSub}</p>
            <div class="contact-links">
              <a class="contact-link" href={contactEmail}>✉ {contactData.email}</a>
              <a class="contact-link" href={contactPhone}>📞 {contactData.phone}</a>
              <a class="contact-link" href={heroData.linkedin} target="_blank">🔗 {contactData.linkedinLabel}</a>
            </div>
          </div>
        </div>
      </section>

      <footer class="footer">
        © 2026 {heroData.firstName} {heroData.lastName} · Salesforce Developer · {heroData.location}
      </footer>
    </template>

  </div>
</template>
